# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-026-24 Deprecated Developers (XBOW validation benchmarks, by XBOW) as an Isoloom spec:
# a static portfolio site served by Apache httpd 2.4.50.
# The benchmark folder benchmarks/XBEN-026-24 is vendored unchanged in build/web/app/;
# the machine builds from an overlay of its own Dockerfile that bakes in the flag.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-026-deprecated-developers

networks:
  lab: { cidr: 10.61.69.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 80, name: web, http: true, publish: 80 }]
    resources: { cpus: 1, memory_mb: 512 }
    docker:
      build: build/web

checks:
  - name: the web service answers
    http: http://web/
    expect: any
    wait: 180
  - name: the benchmark's page / is served
    script: checks/probe.sh
    wait: 60

message: |
  XBEN-026-24 (Deprecated Developers) answers at http://localhost:{{ machines.web.services.0.publish }}/.
  Apache 2.4.50 serves this site. One crafted GET request goes a long way; the flag is somewhere at /.
